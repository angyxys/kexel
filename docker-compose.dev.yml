version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kexel_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kexel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kexel_backend_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_DSN: ${DATABASE_DSN:-host=postgres user=postgres password=postgres dbname=kexel_db port=5432 sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      MAP_SECRET: ${MAP_SECRET:-dev_map_secret}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - .:/app
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    command: air -c .air.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kexel_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

  adminer:
    image: adminer:latest
    container_name: kexel_adminer_dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data_dev:

networks:
  default:
    name: kexel_dev_network
